{{define "layout"}}
<!DOCTYPE html>
<html lang="en" data-theme="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{template "title" .}} · {{if .Server.Name}}{{.Server.Name}}{{else}}Lotus{{end}}</title>
    <meta name="description" content="{{if .Server.Description}}{{.Server.Description}}{{else}}A Blossom media server with a personal drive.{{end}}" />
    <link rel="icon" type="image/svg+xml" href="/res/favicon.svg" />

    <!-- Apply the saved theme before first paint so dark-preferring
         browsers never flash a light palette. -->
    <script src="/static/js/theme.js?v={{assetVersion}}"></script>

    <!-- Design tokens: every color, radius, shadow and font is a CSS
         variable on :root, restated per theme. Plain CSS, no build. -->
    <link rel="stylesheet" href="/static/css/tokens.css?v={{assetVersion}}" />

    <!-- Tailwind v4 compiled in the browser, served locally (no CDN). The
         @theme block registers the token names so utilities like bg-surface
         and text-accent exist; the values resolve through var(--color-*) at
         runtime, which is what lets the data-theme overrides in tokens.css
         retint everything live. -->
    <script src="/static/js/vendor/tailwind-browser.js?v={{assetVersion}}"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-surface-base: #0a0609;
        --color-surface: #110b12;
        --color-surface-elevated: #18101a;
        --color-surface-overlay: #221626;
        --color-surface-inset: rgb(0 0 0 / 0.3);
        --color-surface-inset-strong: rgb(0 0 0 / 0.45);
        --color-surface-hover: #221626;
        --color-surface-active: #18101a;

        --color-text: #f7ecf3;
        --color-text-secondary: #c498b8;
        --color-text-muted: #75607a;
        --color-text-on-accent: #1a0612;

        --color-border: #2a1c2d;
        --color-border-strong: #3f2a43;
        --color-border-focus: #ff7ac6;

        --color-accent: #ff5cb8;
        --color-accent-hover: #ff7ac6;
        --color-accent-dim: rgb(255 92 184 / 0.16);
        --color-accent-fg: #1a0612;
        --color-accent-2: #4fd6d0;
        --color-accent-2-dim: rgb(79 214 208 / 0.14);

        --color-success: oklch(0.72 0.19 155);
        --color-success-dim: oklch(0.72 0.19 155 / 0.13);
        --color-warning: oklch(0.8 0.17 70);
        --color-warning-dim: oklch(0.8 0.17 70 / 0.13);
        --color-danger: oklch(0.66 0.23 20);
        --color-danger-dim: oklch(0.66 0.23 20 / 0.13);
        --color-info: oklch(0.72 0.15 235);
        --color-info-dim: oklch(0.72 0.15 235 / 0.13);
        --color-backdrop: rgb(4 2 5 / 0.82);

        --font-sans: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, monospace;

        --radius-sm: 0.375rem;
        --radius: 0.625rem;
        --radius-md: 0.625rem;
        --radius-lg: 0.875rem;
        --radius-xl: 1.125rem;

        --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.4);
        --shadow: 0 8px 24px rgb(0 0 0 / 0.55);
        --shadow-lg: 0 0 0 1px rgb(255 92 184 / 0.1), 0 24px 64px rgb(0 0 0 / 0.75), 0 0 80px rgb(255 92 184 / 0.06);
      }
    </style>

    <!-- htmx, served locally. The server returns just the view for HX-Request. -->
    <script src="/static/js/vendor/htmx.min.js?v={{assetVersion}}"></script>

    <!-- mill: the sign-in modal and signer for every method (extension,
         Amber, bunker, key). Bundled locally, no CDN. The bridge wires mill
         into the session API and binds the login to a signed challenge. -->
    <script src="/static/mill/mill.umd.min.js?v={{assetVersion}}"></script>
    <script src="/static/js/mill-bridge.js?v={{assetVersion}}" defer></script>
    <script src="/static/js/navigation.js?v={{assetVersion}}" defer></script>
    <script src="/static/js/publish.js?v={{assetVersion}}" defer></script>
    <script src="/static/js/media-servers.js?v={{assetVersion}}" defer></script>
    <script src="/static/js/landing.js?v={{assetVersion}}" defer></script>
    <script src="/static/js/drive.js?v={{assetVersion}}" defer></script>
    <script src="/static/js/settings.js?v={{assetVersion}}" defer></script>
    <script src="/static/js/setup.js?v={{assetVersion}}" defer></script>
    <script src="/static/js/admin.js?v={{assetVersion}}" defer></script>
  </head>
  <body class="flex flex-col min-h-screen bg-surface-base text-text font-sans">
    {{template "header" .}}
    <main id="main-content" class="flex-grow w-full max-w-6xl px-4 py-6 mx-auto" hx-history-elt>
      {{template "view" .}}
    </main>
    {{template "footer" .}}
    {{template "user-dropdown" .}}
    <div id="toast-stack" class="fixed z-50 flex flex-col items-end gap-2 pointer-events-none right-4 bottom-4"></div>
  </body>
</html>
{{end}}
